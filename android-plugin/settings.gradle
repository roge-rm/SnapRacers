// The SnapRacers network plugin for Android: finding games with NSD, Wi-Fi
// Direct and Bluetooth (see src/main/java/com/rm/snapracers/net). It's built
// by tools/build-plugin.sh, with the Gradle that comes with Godot's Android
// build template, and the AAR goes in addons/snapracers_net/bin.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.library' version '8.6.1'
        id 'org.jetbrains.kotlin.android' version '2.1.21'
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'snapracers-net'
