<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213a">
<title>$GODOT_PROJECT_NAME</title>
<!-- The page around the web version, made to look like my other games' pages:
     the icon, "Loading SnapRacers...", and a thin bar with how much is down. -->
<style>
  html, body, #canvas { margin: 0; padding: 0; border: 0; }
  html, body { height: 100%; overflow: hidden; background: #16213a; touch-action: none;
    -webkit-user-select: none; user-select: none; }
  #canvas { display: block; }
  #canvas:focus { outline: none; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; text-align: center;
    background: linear-gradient(#16213a, #2b1b3d); color: #e8e6f5; font: 16px/1.5 system-ui, sans-serif; }
  #status img { width: 96px; height: 96px; border-radius: 22px; }
  #bar { width: min(320px, 100%); height: 4px; border-radius: 2px; background: #2a2838; overflow: hidden; visibility: hidden; }
  #fill { width: 0; height: 100%; background: #b39dff; transition: width 0.2s; }
  #amount { font-size: 13px; color: #8f88aa; font-variant-numeric: tabular-nums; min-height: 1.5em; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">This browser can't draw the game.</canvas>
<noscript>SnapRacers needs JavaScript turned on.</noscript>
<div id="status">
  <img src="index.144x144.png" alt="">
  <div id="status-text">Loading $GODOT_PROJECT_NAME…</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="amount"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const status = document.getElementById('status');
  const text = document.getElementById('status-text');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const amount = document.getElementById('amount');
  const mb = (n) => (n / 1048576).toFixed(1);

  function fail(err) {
    console.error(err);
    text.textContent = err instanceof Error ? err.message : (typeof err === 'string' ? err : "Something went wrong and the game couldn't start.");
    bar.style.display = 'none';
    amount.textContent = '';
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('SnapRacers needs a newer browser than this one, with WebGL 2. Try a recent Chrome, Edge, Firefox or Safari.');
    return;
  }
  engine.startGame({
    'onProgress': function (have, total) {
      if (have > 0 && total > 0) {
        bar.style.visibility = 'visible';
        fill.style.width = (100 * have / total).toFixed(1) + '%';
        amount.textContent = mb(have) + ' of ' + mb(total) + ' MB';
        if (have >= total) {
          text.textContent = 'Starting SnapRacers…';
        }
      }
    },
  }).then(() => status.remove(), fail);
}());
</script>
</body>
</html>
