{% set show_nav = true %}{% set page = 'logs' %}
{% extends "base.html" %}
{% block body %}
<section class="card">
  <div class="card-head">
    <h2>The server's log</h2>
    <div class="actions"><a class="button quiet" href="/logs/download">Download it</a></div>
  </div>
  <p class="muted">The last 500 things the server said.</p>
  <div id="log" class="scroller tall" hx-get="/fragments/log?limit=500" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <p class="muted">Loading...</p>
  </div>
</section>
{% endblock %}
